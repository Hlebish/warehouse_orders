name: Send push notifications

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - id: config
        run: |
          if python3 -c 'import json,os; d=json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"]); assert d.get("type")=="service_account" and d.get("project_id") and d.get("client_email") and d.get("private_key")'; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "Push sender awaits a valid Firebase service-account JSON secret."; fi
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin
        if: steps.config.outputs.ready == 'true'
      - run: node push-sender.cjs
        if: steps.config.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
