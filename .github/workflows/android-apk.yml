name: Build and publish Android app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Make the original notification tone louder
        run: |
          set -euo pipefail
          # Use Python's standard library so this step needs no apt install.
          # Decode MP3 to PCM via bundled JavaSound is not supported reliably;
          # instead use a small Node script and the installed lame/ffmpeg only
          # if present. If neither exists, preserve the original asset and let
          # the Android WebAudio gain boost handle foreground playback.
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -y -i delivered-message-sound.mp3 -af "volume=6dB" -codec:a libmp3lame -q:a 2 "$RUNNER_TEMP/delivered-message-sound-louder.mp3"
            test -s "$RUNNER_TEMP/delivered-message-sound-louder.mp3"
            mv "$RUNNER_TEMP/delivered-message-sound-louder.mp3" delivered-message-sound.mp3
          else
            echo "FFmpeg is not installed; keeping original MP3. Android foreground gain is handled by app.js."
          fi

      - name: Prepare signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/warehouse-release.jks"
          test -s "$RUNNER_TEMP/warehouse-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/warehouse-release.jks" >> "$GITHUB_ENV"

      - name: Set unique Android version
        run: |
          echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK (until signing secrets are configured)
        if: env.HAS_SIGNING_KEY != 'true'
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Print APK signing certificate SHA-1
        shell: bash
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          echo "APK used for signing certificate check: $APK_PATH"
          keytool -printcert -jarfile "$APK_PATH" | grep -E 'SHA1:|SHA256:'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-orders-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK release
        if: env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Заказы · Склад Android v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
