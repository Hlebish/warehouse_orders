name: Build Warehouse Orders Windows app

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Set unique desktop release version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - name: Create and push release tag
        shell: pwsh
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
      - name: Install dependencies
        run: npm install
      - name: Create Windows icon from AMP logo
        run: node -e "const fs=require('fs'); const pngToIco=require('png-to-ico'); pngToIco('../Минималистичная эмблема автозапчастей AMP.png').then(buf=>fs.writeFileSync('icon.ico',buf))"
      - name: Build and publish Windows installer
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-orders-windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
