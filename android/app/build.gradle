plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.amp.warehouseorders'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amp.warehouseorders'
        minSdk 23
        targetSdk 34
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName = (System.getenv("ANDROID_VERSION_NAME") ?: "1.0.1")
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def aliasValue = System.getenv('ANDROID_KEY_ALIAS')
            def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')
            if (storeFilePath && storePasswordValue && aliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias aliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('ANDROID_KEYSTORE_PATH') && System.getenv('ANDROID_KEYSTORE_PASSWORD') && System.getenv('ANDROID_KEY_ALIAS') && System.getenv('ANDROID_KEY_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Debug builds keep Android's standard debug signing.
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-installations'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
