name: Application checks

on:
  pull_request:
    branches:
      - main
    paths:
      - '*.js'
      - '*.mjs'
      - '*.css'
      - 'index.html'
      - 'functions/**'
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/performance-checks.yml'
  push:
    branches:
      - main
      - performance-audit-2026-11
    paths:
      - '*.js'
      - '*.mjs'
      - '*.css'
      - 'index.html'
      - 'functions/**'
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/performance-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application syntax
        run: |
          node --input-type=module --check < app.js
          node --check sw.js
          node --check functions/index.js
      - name: Run application regression tests
        working-directory: functions
        run: npm test
